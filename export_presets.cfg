; Godot 4.x 导出预设（Windows Desktop 生产版）
; 生产策略：单文件 exe（PCK 内嵌）+ 压缩脚本字节码，兼顾分发便利与体积
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
; all_resources：导出项目内全部资源。必须保持开启——
; 本作通过 DirAccess 在运行时动态扫描 data/equipment、data/bullet/pattern、
; data/themes、data/temple、data/upgrades 等目录，这些资源无法被依赖分析发现，
; 若改为"仅导出选中资源"会导致线上运行期加载失败。
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="d:/Projects/OneiricDesigner/build/OneiricDesigner.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
; 2 = Binary tokens (compressed)：GDScript 编译为压缩字节码，减小 pck 体积
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; 0 = 不额外生成 .console.exe 控制台包装器（少一个文件）
debug/export_console_wrapper=0
; true = PCK 内嵌进 exe，实现单文件分发
binary_format/embed_pck=true
; 桌面 GPU 通用纹理压缩格式，Windows 导出必需
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
; 留空 = 使用 project.godot 中 config/icon 指定的项目图标
application/icon=""
application/icon_interpolation=4
